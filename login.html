<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EcoBairro</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>EcoBairro</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="cadastro.html">Cadastre-se</a>
        </nav>
    </header>

    <main>
        <section class="formulario">
            <h2>Entre no EcoBairro</h2>
            <p>Informe seu e-mail e sua senha para continuar.</p>
            <p class="aviso">Demonstração acadêmica: utilize dados fictícios. Não há autenticação de usuários.</p>

            <form action="index.html">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" required>

                <button type="submit">Entrar</button>
            </form>

            <p>Primeiro acesso? <a href="cadastro.html">Cadastre-se aqui</a>.</p>
        </section>
    </main>

    <footer>
        <p>EcoBairro — Projeto acadêmico sobre consumo e produção responsáveis.</p>
    </footer>
</body>
</html>
